name: Build Driver + Police APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: driver_app
            label: "AmbuRoute Driver"
          - app: police_app
            label: "AmbuRoute Police"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Finds the app folder wherever it is in your repo
      # (works if the repo root is Smart_City_Ambulance, or ambulance_alert_app, or anything else).
      - name: Find app folder
        run: |
          APP_DIR=$(find . -type d -name "${{ matrix.app }}" -path "*ambulance_alert_app*" -not -path "*/node_modules/*" | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "Could not find ${{ matrix.app }}. Folders in this repo:"
            find . -maxdepth 3 -type d -not -path "./.git*" | head -50
            exit 1
          fi
          TOOLS_DIR="$(dirname "$APP_DIR")/tools"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "TOOLS_DIR=$TOOLS_DIR" >> "$GITHUB_ENV"
          echo "Found: $APP_DIR (tools: $TOOLS_DIR)"
          test -f "$APP_DIR/pubspec.yaml" || { echo "pubspec.yaml missing in $APP_DIR"; exit 1; }
          test -f "$TOOLS_DIR/patch_android.py" || { echo "patch_android.py missing in $TOOLS_DIR"; exit 1; }

      - name: Create android folder and add permissions
        working-directory: ${{ env.APP_DIR }}
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --platforms=android --org com.amburoute --project-name ${{ matrix.app }} .
          rm -rf lib test
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          python3 "${{ github.workspace }}/${{ env.TOOLS_DIR }}/patch_android.py" android/app/src/main/AndroidManifest.xml "${{ matrix.label }}"

      - name: Packages download
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      # Errors stop the build. Style hints (info) and warnings do not.
      - name: Check code
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: APK build
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release

      - name: APK upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
