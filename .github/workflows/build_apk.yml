name: Build Android APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: Build Driver App APK
        run: |
          cd Smart_City_Ambulance/ambulance_alert_app/driver_app
          flutter pub get
          flutter build apk --release

      - name: Build Police App APK
        run: |
          cd Smart_City_Ambulance/ambulance_alert_app/police_app
          flutter pub get
          flutter build apk --release

      - name: Upload Driver App APK
        uses: actions/upload-artifact@v4
        with:
          name: driver-app-apk
          path: Smart_City_Ambulance/ambulance_alert_app/driver_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Police App APK
        uses: actions/upload-artifact@v4
        with:
          name: police-app-apk
          path: Smart_City_Ambulance/ambulance_alert_app/police_app/build/app/outputs/flutter-apk/app-release.apk