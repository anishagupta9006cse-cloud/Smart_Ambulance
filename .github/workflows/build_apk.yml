name: Build Driver + Police APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: driver_app
            label: "AmbuRoute Driver"
          - app: police_app
            label: "AmbuRoute Police"
    env:
      BASE: Smart_City_Ambulance/ambulance_alert_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create android folder and add permissions
        working-directory: ${{ env.BASE }}/${{ matrix.app }}
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --platforms=android --org com.amburoute --project-name ${{ matrix.app }} .
          rm -rf lib test
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          python3 ../tools/patch_android.py android/app/src/main/AndroidManifest.xml "${{ matrix.label }}"

      - name: Packages download
        working-directory: ${{ env.BASE }}/${{ matrix.app }}
        run: flutter pub get

      - name: APK build
        working-directory: ${{ env.BASE }}/${{ matrix.app }}
        run: flutter build apk --release

      - name: APK upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ env.BASE }}/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
