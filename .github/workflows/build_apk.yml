name: Build APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # Build Driver App APK
      - name: Build Driver App APK
        working-directory: Smart_City_Ambulance/ambulance_alert_app/driver_app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      # Build Police App APK
      - name: Build Police App APK
        working-directory: Smart_City_Ambulance/ambulance_alert_app/police_app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      # Upload Driver App APK Artifact
      - name: Upload Driver App APK
        uses: actions/upload-artifact@v4
        with:
          name: driver-app-apk
          path: Smart_City_Ambulance/ambulance_alert_app/driver_app/build/app/outputs/flutter-apk/app-release.apk

      # Upload Police App APK Artifact
      - name: Upload Police App APK
        uses: actions/upload-artifact@v4
        with:
          name: police-app-apk
          path: Smart_City_Ambulance/ambulance_alert_app/police_app/build/app/outputs/flutter-apk/app-release.apk